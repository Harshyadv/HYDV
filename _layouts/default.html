<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ page.title | default: site.title }}</title>
        <meta name="description" content="{{ page.description | default: site.description }}" />

        <!-- Open Graph / Facebook / LinkedIn / Discord -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="{{ page.url | absolute_url }}" />
        <meta property="og:title" content="{{ page.title | default: site.title }}" />
        <meta property="og:description" content="{{ page.description | default: site.description }}" />
        <meta property="og:image" content="{{ page.image | default: site.image | absolute_url }}" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:url" content="{{ page.url | absolute_url }}" />
        <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
        <meta name="twitter:description" content="{{ page.description | default: site.description }}" />
        <meta name="twitter:image" content="{{ page.image | default: site.image | absolute_url }}" />

        <!-- REQUIRED for mobile responsiveness -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="{{ '/assets/style.css' | relative_url }}"
        />
        <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" />
        <script src="{{ '/assets/script.js' | relative_url }}" defer></script>
    </head>
    <body>
        <main class="box" markdown="1">
            {{ content }} {% include footer.html %}
        </main>
    </body>
</html>
